name: Image

# Pushing a controller release tag (controller-vX.Y.Z) builds the container
# image from Containerfile and pushes it to ghcr.io/technotut/booth-display:X.Y.Z
# (and :latest, unless the tag has a pre-release suffix such as -rc.1).
# Pull requests that touch the image only build it, without pushing.
on:
  push:
    tags: ['controller-v*']
  pull_request:
    paths:
      - Containerfile
      - .dockerignore
      - container/**
      - scripts/install-ndi-sdk.sh
      - .github/workflows/image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # controller-v1.2.0 -> 1.2.0. A version with a pre-release suffix
      # (1.2.0-rc.1) does not move :latest.
      - id: version
        if: github.event_name != 'pull_request'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#controller-v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$v" == *-* ]]; then latest=false; else latest=true; fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.latest == 'true' }}
            type=ref,event=pr

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
